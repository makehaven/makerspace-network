<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Makerspace Network: three spaces, joined. Teal is the site accent. -->
  <rect width="64" height="64" rx="14" fill="#10696f"/>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="16" x2="16" y2="45"/>
    <line x1="32" y1="16" x2="48" y2="45"/>
    <line x1="16" y1="45" x2="48" y2="45"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="16" r="8"/>
    <circle cx="16" cy="45" r="8"/>
    <circle cx="48" cy="45" r="8"/>
  </g>
</svg>
